<style>

.btn:hover{transform:translateY(-2px);border-color:var(--gold)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold);color:#241800;border-color:#fff2b0}
.btn.alt{background:#173a5a;border-color:#5aa0d8}
.btn.ghost{background:transparent;font-size:15px;min-height:36px}
.btn.sm{min-height:36px;padding:4px 12px;font-size:15px}
.btn[aria-pressed="true"]{background:#1f5a44;border-color:var(--green)}
.btn[aria-pressed="true"]::before{content:"\2713  "}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.gone{text-decoration:line-through;opacity:.55}

.stat span{overflow-wrap:anywhere}
.stat.pop{animation:pop .5s}
.bar{height:8px;background:#000;border-radius:4px;margin-top:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width .6s}
.bar.low i{background:var(--red)}
.views{display:grid;grid-template-columns:1fr 1fr;gap:8px}
canvas.px{width:100%;aspect-ratio:8/3;image-rendering:pixelated;border:4px solid var(--line);border-radius:8px;display:block;background:#000}

.say{font-size:20px;margin:6px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}

.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.big{font:800 24px ui-monospace,Consolas,monospace;color:var(--gold)}

.tipline{color:var(--mut);font-size:15px}
.sus{text-align:center}.sus canvas{width:96px;height:120px;image-rendering:pixelated;background:#0d1d33;border:2px solid var(--line);border-radius:6px}
.sus ul{text-align:left;font-size:14px;list-style:none;padding:0;margin:4px 0}

table{border-collapse:collapse;width:100%;margin:6px 0;font-size:16px}th,td{border:2px solid #35577f;padding:5px 9px;text-align:left}th{background:#173050}

@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.stampbig{display:inline-block;border:6px solid var(--green);color:var(--green);font:900 34px ui-monospace,monospace;padding:2px 18px;transform:rotate(-6deg);animation:pop .6s;letter-spacing:4px}
body.noanim *{animation:none!important;transition:none!important}

@media print{#ctrl,.views,#hud,.noprint{display:none!important}body{background:#fff;color:#000}#panel,#notebook{border:1px solid #000;background:#fff;color:#000}}
